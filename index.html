<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My OJT Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="nav">
    <a href="#top" class="brand">OJT Journal</a>
    <nav>
      <a href="#about">About</a>
      <a href="#journal">Journal</a>
      <a href="#gallery">Gallery</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1>My <span class="accent">488-Hour</span> On-the-Job Training Journey</h1>
        <p class="intro" id="intro"></p>
        <a href="#journal" class="btn">Read the journal</a>
      </div>
      <figure class="hero-photo" id="hero-photo"></figure>
    </section>

    <section class="progress-card" aria-label="Hours progress">
      <div class="progress-head">
        <div>
          <p class="label">Hours rendered</p>
          <p class="big"><span id="hours-done">0</span> <small>/ <span id="hours-req">488</span> hrs</small></p>
        </div>
        <div class="stats">
          <div><p class="label">Remaining</p><p class="mid" id="hours-left">0</p></div>
          <div><p class="label">Weeks logged</p><p class="mid" id="weeks">0</p></div>
          <div><p class="label">Complete</p><p class="mid" id="percent">0%</p></div>
        </div>
      </div>
      <div class="bar"><div class="fill" id="bar-fill"></div></div>
    </section>

    <section id="about" class="about">
      <h2>About my OJT</h2>
      <dl id="about-list"></dl>
    </section>

    <section id="journal">
      <h2>Weekly journal</h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <section id="gallery">
      <h2>Photo gallery</h2>
      <div class="gallery" id="gallery-grid"></div>
    </section>
  </main>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="lb-next" aria-label="Next">&#8250;</button>
    <p id="lb-caption"></p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
